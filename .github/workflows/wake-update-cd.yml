# おこして更新を Google Drive の builds/wake-update/ に置き、nox-apk-manager から入れられるようにする。
# 手順と Secrets の作り方は apps/wake-update/README.md の「GitHub Actions から配布する」。
name: wake-update CD

on:
  push:
    branches: [main]
    paths:
      - "apps/wake-update/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/ci/**"
      - ".github/workflows/wake-update-cd.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "同じ versionCode の版が Drive にあっても置き直す"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wake-update-cd
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP: wake-update
      BUILD_TOOLS: "37.0.0"
      RCLONE_VERSION: v1.75.1
      RCLONE_SHA256: 982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab
    steps:
      - name: Secrets があるか確かめる
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
        run: |
          missing=""
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || missing="$missing DEBUG_KEYSTORE_BASE64"
          [ -n "$RCLONE_DRIVE_TOKEN" ] || missing="$missing RCLONE_DRIVE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::リポジトリの Secrets に次を登録してください:$missing（手順は apps/wake-update/README.md）"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK（compileSdk 37.2）を入れる
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.2" "build-tools;$BUILD_TOOLS" > /dev/null

      # ほかの自作アプリと同じ鍵で署名するため、PC の debug.keystore を使う
      - name: 署名鍵を置く
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          dir="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$dir"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$dir/debug.keystore"
          echo "KEYSTORE=$dir/debug.keystore" >> "$GITHUB_ENV"

      - name: テストとビルド
        run: ./gradlew :apps:$APP:testDebugUnitTest :apps:$APP:assembleRelease

      - name: 署名を確かめる
        env:
          EXPECTED_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          apk="apps/$APP/build/outputs/apk/release/$APP-release.apk"
          actual=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)
          keystore=$(keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$actual" ] || [ "$actual" != "$keystore" ]; then
            echo "::error::APK が Secrets の鍵で署名されていない（APK: $actual / 鍵: $keystore）"
            exit 1
          fi
          expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -n "$expected" ] && [ "$expected" != "$actual" ]; then
            echo "::error::署名鍵が変数 SIGNING_CERT_SHA256 と違う（端末の版に上書きできない）: $actual"
            exit 1
          fi
          echo "signed with $actual"

      - name: rclone を入れる
        run: |
          curl -fsSL -o /tmp/rclone.zip "https://downloads.rclone.org/$RCLONE_VERSION/rclone-$RCLONE_VERSION-linux-amd64.zip"
          echo "$RCLONE_SHA256  /tmp/rclone.zip" | sha256sum --check -
          unzip -q -j /tmp/rclone.zip "*/rclone" -d /tmp/rclone-bin
          sudo install -m 755 /tmp/rclone-bin/rclone /usr/local/bin/rclone

      - name: Google Drive に置く
        env:
          # rclone の設定はファイルを作らず環境変数で渡す（リモート名 gdrive）
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          NOX_DRIVE_BUILDS: ${{ vars.NOX_DRIVE_BUILDS || 'gdrive:builds' }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          args=(--app "$APP" --variant release)
          [ "$FORCE" = "true" ] && args+=(--force)
          python3 scripts/ci/publish_drive.py "${args[@]}"
