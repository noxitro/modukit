# おこして更新のテスト。push のたびに、単体テストとエミュレータのテストを動かす。
# エミュレータのテスト（src/androidTest）は、起こす → 更新する → 画面オフでスリープに戻る、の 1 周を確かめる。
# ディープスリープは Galaxy の機能なので、Galaxy がすることは pm コマンドで再現している
name: wake-update CI

on:
  push:
    paths:
      - "apps/wake-update/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/wake-update-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # 既定の "tools" は今の SDK にないので、使うものだけを入れる
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :apps:wake-update:testDebugUnitTest
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: apps/wake-update/build/reports/tests/

  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # minSdk と、One UI 8 と同じ Android 16
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # 既定の "tools" は今の SDK にないので、使うものだけを入れる
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v5

      # エミュレータを速く動かすため、KVM を使えるようにする
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # エミュレータを起動する前にビルドしておく（起動中の待ち時間を短くする）
      - name: Build
        run: >-
          ./gradlew
          :apps:wake-update:assembleDebug
          :apps:wake-update:assembleDebugAndroidTest
          :apps:wake-update:sleeper:assembleV1Debug
          :apps:wake-update:sleeper:assembleV2Debug

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb push apps/wake-update/sleeper/build/outputs/apk/v1/debug/sleeper-v1-debug.apk /data/local/tmp/sleeper-v1.apk
            adb push apps/wake-update/sleeper/build/outputs/apk/v2/debug/sleeper-v2-debug.apk /data/local/tmp/sleeper-v2.apk
            ./gradlew :apps:wake-update:connectedDebugAndroidTest

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-test-reports-api${{ matrix.api-level }}
          path: apps/wake-update/build/reports/androidTests/
